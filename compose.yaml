# Production stack for ariane.lucasdebeve.eu (files.ariane.lucasdebeve.eu serves presigned downloads).
# No reverse proxy here: the VPS-wide Caddy (~/configuration/caddy) terminates TLS and reaches
# php and garage through the external `proxy` network (see caddy/conf/sites/ariane.caddy there).
# Usage: docker compose --env-file .env.prod up -d --build
name: ariane

x-app: &app
  build:
    context: .
    target: app
  image: ariane-app:latest
  restart: unless-stopped
  env_file: .env.prod
  environment:
    APP_ENV: prod
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
    S3_ENDPOINT: http://garage:3900
    CLAMAV_HOST: clamav
    TIKA_URL: http://tika:9998
    GOTENBERG_URL: http://gotenberg:3000
    ANTIVIRUS_DRIVER: clamav
  depends_on:
    database: { condition: service_healthy }
    garage: { condition: service_started }
  networks: [backend]

services:
  # Copies the compiled public/ directory into the volume the shared Caddy serves static
  # files from. Runs on every `up`, so the volume always matches the image.
  assets:
    image: ariane-app:latest
    build:
      context: .
      target: app
    user: root
    restart: "no"
    network_mode: none
    command: ["sh", "-c", "find /export -mindepth 1 -delete && cp -a /srv/app/public/. /export/"]
    healthcheck:
      disable: true
    volumes:
      - public:/export

  php:
    <<: *app
    depends_on:
      database: { condition: service_healthy }
      garage: { condition: service_started }
      assets: { condition: service_completed_successfully }
    networks:
      backend: {}
      proxy:
        aliases: [ariane-php]

  worker:
    <<: *app
    command: ["php", "bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    healthcheck:
      disable: true

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    networks: [backend]

  # Garage S3: never published on the host. Files reach users through the shared
  # Caddy's files.* vhost, which forwards presigned GET/HEAD requests only.
  garage:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      backend: {}
      proxy:
        aliases: [ariane-garage]

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    # Needs outbound access for signature updates (freshclam).
    networks: [backend, egress]

  # Tika (with Tesseract OCR) and Gotenberg have no outbound network access.
  tika:
    image: apache/tika:3.2.3.0-full
    restart: unless-stopped
    networks: [backend]

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=120s
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
      - --webhook-disable=true
      - --api-disable-download-from=true
      - --libreoffice-disable-routes=false
    networks: [backend]

networks:
  egress: {}
  backend:
    internal: true
  # Created by the shared Caddy stack (`make up` in ~/configuration).
  proxy:
    external: true

volumes:
  # Owned by the shared Caddy stack, which mounts it read-only.
  public:
    name: ariane_public
    external: true
  db_data: {}
  garage_meta: {}
  garage_data: {}
  clamav_db: {}
