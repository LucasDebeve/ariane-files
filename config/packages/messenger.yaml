framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 10000
                    multiplier: 3
            failed: 'doctrine://default?queue_name=failed'

        routing:
            App\Message\ProcessPublishedDocument: async

when@test:
    framework:
        messenger:
            transports:
                async: 'sync://'
