security:
    password_hashers:
        App\Entity\User:
            algorithm: argon2id
        # Dedicated hasher for the shared access code (stored hashed only).
        share_code:
            algorithm: argon2id

    role_hierarchy:
        ROLE_ADMIN: ROLE_CERTIFIE
        ROLE_CERTIFIE: ROLE_USER

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            entry_point: App\Security\AccessEntryPoint
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: certified_index
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                target: home
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                enable_csrf: true
                default_target_path: certified_index

    access_control:
        - { path: ^/2fa, role: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/certifie, roles: ROLE_CERTIFIE }
        - { path: ^/compte, roles: ROLE_CERTIFIE }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10
            share_code:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10
